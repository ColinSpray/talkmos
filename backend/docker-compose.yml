version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talkmos-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
    extra_hosts:
      # Reaches the separately-deployed ../translator stack on the host.
      - "host.docker.internal:host-gateway"
    ports:
      - "6001:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    volumes:
      # Required to boot: fcmService.js requires this at module load.
      - ./credentials:/app/credentials:ro
      # Admin-uploaded APK; lost on redeploy without this.
      - apk_uploads:/app/uploads
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      livekit:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: talkmos-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env — refusing to start with no password}
      --appendonly yes
      --maxmemory ${REDIS_MAX_MEMORY:-512mb}
      --maxmemory-policy volatile-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env — refusing to start with no password}
    mem_limit: 512m
    cpus: 1

  # Writes the shared-secret keyfile the replica set needs for internal auth:
  # mongod refuses --replSet while authorization is on unless one exists, and
  # it must be mode 400 owned by the image's mongodb user (uid 999).
  # Generated once into a volume — never rewritten, since changing it would
  # lock the existing data's members out of each other.
  mongo-keyfile:
    image: mongo:7.0
    container_name: talkmos-mongo-keyfile
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if [ ! -s /keyfile/mongo.key ]; then
          openssl rand -base64 756 > /keyfile/mongo.key
        fi
        chown 999:999 /keyfile/mongo.key
        chmod 400 /keyfile/mongo.key
    volumes:
      - mongo_keyfile:/keyfile

  # Single-node replica set (rs0). Not for redundancy — one node gives none —
  # but because the driver only offers transactions against a replica set, and
  # createConversation/createCommunity both wrap their multi-collection writes
  # in session.withTransaction.
  mongo:
    image: mongo:7.0
    container_name: talkmos-mongo
    restart: unless-stopped
    command:
      - --replSet
      - rs0
      - --bind_ip_all
      - --keyFile
      - /etc/mongo-keyfile/mongo.key
    environment:
      - TZ=Asia/Kolkata
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set in .env — refusing to start with no password}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_keyfile:/etc/mongo-keyfile:ro
    depends_on:
      mongo-keyfile:
        condition: service_completed_successfully
    # Healthy means "electable and writable", not merely "answering" — an
    # uninitiated or non-primary node takes no writes, so the backend must not
    # be released against it.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 2g
    cpus: 1

  # One-shot: initiates rs0 on first boot, then exits. On later boots
  # rs.status() already succeeds and it exits without touching anything.
  #
  # The member host is "mongo:27017", which only resolves inside the Compose
  # network — a client on the host must connect directly (no replicaSet= in
  # the URI), since the driver would otherwise chase that hostname.
  mongo-init:
    image: mongo:7.0
    container_name: talkmos-mongo-init
    restart: "no"
    environment:
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set in .env — refusing to start with no password}
    depends_on:
      mongo:
        condition: service_started
    entrypoint:
      - bash
      - -c
      - |
        set -e
        # mongo's own healthcheck can't gate this — it only passes once this
        # has run — so poll for the port coming up instead.
        for _ in $$(seq 1 60); do
          mongosh --quiet --host mongo --port 27017 \
            -u root -p "$$MONGO_ROOT_PASSWORD" --authenticationDatabase admin \
            --eval 'db.hello()' > /dev/null 2>&1 && break
          sleep 2
        done
        mongosh --quiet --host mongo --port 27017 \
          -u root -p "$$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --eval '
            try {
              rs.status();
              print("rs0 already initiated");
            } catch (e) {
              print("initiating rs0");
              rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]});
            }
            for (let i = 0; i < 60 && !db.hello().isWritablePrimary; i++) {
              sleep(1000);
            }
            if (!db.hello().isWritablePrimary) {
              print("rs0 did not reach PRIMARY");
              quit(1);
            }
            print("rs0 PRIMARY");
          '

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: talkmos-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Go worker: consumes the FCM/mail/SMS jobs the backend publishes to RabbitMQ.
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: talkmos-notification-service
    restart: unless-stopped
    env_file:
      - ./notification-service/.env
    environment:
      - TZ=Asia/Kolkata
    volumes:
      - ./credentials:/credentials:ro
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Log store. Queried through Grafana; not exposed beyond loopback.
  loki:
    image: grafana/loki:3.4.2
    container_name: talkmos-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:6003:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1g

  # Ships every container's stdout to Loki. Replaces Promtail, which is EOL.
  #
  # The docker socket is what makes container discovery work, and mounting it
  # — even read-only — is effectively root on the host for anything that can
  # talk to it. That is the standard trade for log collection, but it is a
  # real grant: keep this container's image pinned and treat it as privileged.
  alloy:
    image: grafana/alloy:v1.6.1
    container_name: talkmos-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    # Needed to read the docker socket; the image's default user cannot.
    user: root
    volumes:
      - ./observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
    mem_limit: 512m

  # Log UI. Loopback only — put it behind the same reverse proxy as anything
  # else before exposing it.
  grafana:
    image: grafana/grafana:11.5.2
    container_name: talkmos-grafana
    restart: unless-stopped
    environment:
      - TZ=Asia/Kolkata
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env — refusing to start on the default admin/admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Grafana sends X-Frame-Options: deny by default, which blanks the admin
      # panel's inline log pane. Only meaningful for that embed; the panel's
      # "Open in Grafana" link works either way.
      - GF_SECURITY_ALLOW_EMBEDDING=true
      # Defaults suit reaching Grafana directly on localhost:6002. Behind the
      # nginx site in nginx/grafana.conf, set in .env:
      #   GRAFANA_ROOT_URL=https://logs.talkmos.com
      #   GRAFANA_COOKIE_SAMESITE=none   (needed for the cross-origin iframe)
      #   GRAFANA_COOKIE_SECURE=true     (samesite=none is ignored without it)
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:6002}
      - GF_SECURITY_COOKIE_SAMESITE=${GRAFANA_COOKIE_SAMESITE:-lax}
      - GF_SECURITY_COOKIE_SECURE=${GRAFANA_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:6002:3000"
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
    mem_limit: 512m

  # host networking for the UDP media range (50000-50200) and 7880/7881 — open
  # those in the firewall. Docker forbids host networking alongside a custom
  # bridge, which is why no service here joins one.
  livekit:
    image: livekit/livekit-server:latest
    container_name: talkmos-livekit
    restart: always
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    command: --config /etc/livekit.yaml

volumes:
  rabbitmq_data:
  mongo_data:
  mongo_keyfile:
  redis_data:
  apk_uploads:
  loki_data:
  alloy_data:
  grafana_data:
