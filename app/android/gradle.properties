org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 compiles Kotlin itself, but several plugins in this app's dependency
# set still apply the Kotlin Gradle Plugin unconditionally (audio_session,
# device_info_plus — pinned to 12.x by livekit_client — get_video_thumbnail),
# and AGP fails the build when both are in play. Opting out keeps the KGP path
# alive until they migrate. Flutter's "plugins that apply KGP" warning is the
# heads-up that this is temporary.
android.builtInKotlin=false
org.gradle.java.home=/usr/lib/jvm/java-23-openjdk
org.gradle.java.installations.paths=/home/arch/Desktop/talkmos/android/.jdks/jdk-17.0.10+7
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
