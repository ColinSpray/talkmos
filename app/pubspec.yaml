name: talkmos
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  socket_io_client: ^3.1.6
  livekit_client: ^2.10.0
  flutter_webrtc: 1.6.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_dotenv: ^6.0.1
  skeletonizer: ^2.1.3
  google_fonts: ^8.1.0
  flutter_svg: ^2.0.9
  sqflite: ^2.4.3
  path: ^1.9.1
  cryptography: ^2.9.0
  google_sign_in: ^7.2.0
  firebase_auth: ^6.5.4
  firebase_crashlytics: ^5.2.4
  json_annotation: ^4.12.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  image_picker: ^1.1.2
  just_audio: ^0.10.6
  video_player: ^2.9.2
  get_video_thumbnail: ^0.9.0
  path_provider: ^2.1.4
  record: ^7.1.1
  emoji_picker_flutter: ^4.3.0
  url_launcher: ^6.3.0
  flutter_contacts: ^2.3.1
  file_picker: ^10.3.10
  geolocator: ^14.0.2
  open_filex: ^4.7.0
  flutter_local_notifications: ^22.2.0
