
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name logs.talkmos.com;

    # Grafana is an admin tool: keep it out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:6002;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Grafana Live (the Live toggle in Explore) is a websocket. Without the
        # upgrade headers nothing streams and it fails silently.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # An Explore query over a wide range outruns the 60s default and comes
        # back as a 504 mid-query.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 30s;

        # Streaming responses must not sit in a buffer waiting to fill.
        proxy_buffering off;
    }

    # Same upstream; this exists only for the much longer read timeout a live
    # tail needs. nginx prefers it because it is the longer matching prefix.
    location /api/live/ {
        proxy_pass http://127.0.0.1:6002;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
